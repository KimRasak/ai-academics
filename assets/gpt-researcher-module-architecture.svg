<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">GPT Researcher 模块架构图</title>
