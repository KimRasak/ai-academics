      @media(prefers-color-scheme:dark){:root{color-scheme:dark;--page:#0d0d0d;--surface:#1a1a19;--surface2:#232321;--ink:#fff;--secondary:#c3c2b7;--muted:#a5a39c;--grid:#383835;--blue:#3987e5;--green:#008300;--magenta:#d55181;--yellow:#c98500;--blueTint:#18283b;--greenTint:#152b18;--magentaTint:#321d26;--yellowTint:#352912}}
      text{font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:var(--ink)} .title{font-size:34px;font-weight:760;letter-spacing:-.5px}.subtitle{font-size:15px;fill:var(--secondary)}.layer{font-size:14px;font-weight:700;fill:var(--muted);letter-spacing:1.5px}.node{filter:url(#shadow)}.box{fill:var(--surface);stroke:var(--grid);stroke-width:1.2}.box-alt{fill:var(--surface2);stroke:var(--grid);stroke-width:1.2}.blue{fill:var(--blueTint);stroke:var(--blue)}.green{fill:var(--greenTint);stroke:var(--green)}.magenta{fill:var(--magentaTint);stroke:var(--magenta)}.yellow{fill:var(--yellowTint);stroke:var(--yellow)}.accent-blue{fill:var(--blue)}.accent-green{fill:var(--green)}.accent-magenta{fill:var(--magenta)}.accent-yellow{fill:var(--yellow)}.node-title{font-size:17px;font-weight:720}.node-sub{font-size:12.5px;fill:var(--secondary)}.code{font-size:11.5px;fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.flow{fill:none;stroke:#898781;stroke-width:2;marker-end:url(#arrow)}.flow-main{fill:none;stroke:var(--blue);stroke-width:2.4;marker-end:url(#arrow-blue)}.flow-dash{fill:none;stroke:#898781;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}.pill{fill:var(--surface);stroke:var(--grid)}.pill-text{font-size:11.5px;fill:var(--secondary)}.small{font-size:11.5px;fill:var(--muted)}.legend{font-size:12px;fill:var(--secondary)}.node:hover .box,.node:hover .box-alt{stroke-width:2.5}
