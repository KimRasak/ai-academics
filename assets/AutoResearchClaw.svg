<g transform="translate(335 168)"><rect class="card" width="230" height="71" rx="5"/><text class="h" x="17" y="25">RCConfig</text><text class="body" x="17" y="46">YAML 加载、合并与校验</text><text class="mono" x="17" y="63">researchclaw/config.py</text></g>
