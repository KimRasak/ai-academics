<g transform="translate(60 236)"><rect class="card" width="210" height="55" rx="5"/><rect width="6" height="55" rx="3" fill="#078500"/><text class="h" x="20" y="24">FastAPI Server</text><text class="mono" x="20" y="43">researchclaw/server/</text></g>
<g transform="translate(60 305)"><rect class="card" width="210" height="54" rx="5"/><rect width="6" height="54" rx="3" fill="#e76fa2"/><text class="h" x="20" y="24">Web / Dashboard</text><text class="body" x="20" y="43">运行观察与控制面</text></g>
