<g transform="translate(1220 168)"><rect class="card" width="320" height="83" rx="5"/><text class="h" x="19" y="26">运行工作区</text><text class="mono" x="19" y="48">artifacts/&lt;run-id&gt;/stage-XX/</text><text class="body" x="19" y="68">JSON · YAML · JSONL · Markdown</text></g>
<g transform="translate(1220 267)"><rect class="card" width="152" height="97" rx="5"/><text class="h" x="17" y="26">运行元数据</text><text class="body" x="17" y="49">Checkpoint</text><text class="body" x="17" y="68">Event / Cost</text><text class="body" x="17" y="87">Stage Meta</text></g>
<g transform="translate(1388 267)"><rect class="card" width="152" height="97" rx="5"/><text class="h" x="17" y="26">最终交付物</text><text class="body" x="17" y="49">Paper / PDF</text><text class="body" x="17" y="68">LaTeX / Figures</text><text class="body" x="17" y="87">Citation Report</text></g>
<rect x="1220" y="381" width="320" height="47" rx="6" fill="#edf5ff" stroke="#b9d4f4"/><text class="body" x="1239" y="410">阶段之间通过标准产物文件传递数据</text>
