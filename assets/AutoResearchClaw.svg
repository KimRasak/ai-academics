 </style>
</defs>
<rect width="1600" height="1100" fill="#f4f6f8"/>
<text class="title" x="40" y="52">AutoResearchClaw 模块架构</text><text class="sub" x="40" y="84">从研究主题到论文交付：控制流、阶段业务与横向能力的协作关系</text>
